name: Run Migrations & Deploy

on:
  push:
    branches: [ main ]

jobs:
  migrations:
    name: Run Supabase SQL migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run admin-auth.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo 'SUPABASE_DB_URL secret is missing' && exit 1; fi
          psql "$SUPABASE_DB_URL" -f supabase/admin-auth.sql

      - name: Run multi-region-rls.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -f supabase/multi-region-rls.sql

      - name: Run central-admin-users.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -f supabase/central-admin-users.sql

  vercel_deploy:
    name: Trigger Vercel Deploy
    runs-on: ubuntu-latest
    needs: migrations
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Vercel CLI
        run: npm install -g vercel@33

      - name: Trigger Vercel Production Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo 'VERCEL_TOKEN missing' && exit 1; fi
          vercel --prod --confirm --token "$VERCEL_TOKEN" --org "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID"
