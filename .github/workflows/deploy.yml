name: Run Migrations & Deploy

on:
  push:
    branches: [ main ]

jobs:
  migrations:
    name: Run Supabase migrations (staging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Run Supabase DB push (staging)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then echo 'SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF missing' && exit 1; fi
          supabase db push --project-ref "$SUPABASE_PROJECT_REF" --token "$SUPABASE_ACCESS_TOKEN" --non-interactive || (
            echo 'supabase db push failed, attempting fallback to running SQL files via psql'; exit 1
          )

  staging_vercel:
    name: Trigger Vercel Staging Deploy
    runs-on: ubuntu-latest
    needs: migrations
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Vercel CLI
        run: npm install -g vercel@33

      - name: Trigger Vercel Staging Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo 'VERCEL_TOKEN missing' && exit 1; fi
          vercel --confirm --token "$VERCEL_TOKEN" --org "$VERCEL_ORG_ID" --project "${VERCEL_PROJECT_ID}" || vercel --confirm --token "$VERCEL_TOKEN"

  vercel_deploy:
    name: Trigger Vercel Production Deploy
    runs-on: ubuntu-latest
    needs: staging_vercel
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Vercel CLI
        run: npm install -g vercel@33

      - name: Trigger Vercel Production Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo 'VERCEL_TOKEN missing' && exit 1; fi
          vercel --prod --confirm --token "$VERCEL_TOKEN" --org "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID"
